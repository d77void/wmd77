[package]
name = "wmd77"
version = "0.5.0"
description = "Simple Tiling WM written with Penrose Libraries."
authors = ["Daniel Azevedo", "dani-77 <daniazevedo77@posteo.net>"]
license = "MIT"
edition = "2024"

[dependencies]
anyhow = "1.0"
# Already pulled in by penrose; declared so main.rs can reset SIGCHLD before
# a restart re-execs wmd77, and reload.rs can install the SIGHUP handler.
nix = { version = "0.30", default-features = false, features = ["signal"] }
penrose = "0.4.0"
penrose_ui = "0.4.0"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
